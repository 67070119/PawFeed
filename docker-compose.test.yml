services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pawfeed_test
      POSTGRES_USER: pawfeed
      POSTGRES_PASSWORD: pawfeed_test
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawfeed -d pawfeed_test"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql/data
