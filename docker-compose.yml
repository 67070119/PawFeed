services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawfeed}
      POSTGRES_USER: ${POSTGRES_USER:-pawfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh or scripts/start.ps1 first}
      TZ: Asia/Bangkok
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawfeed} -d ${POSTGRES_DB:-pawfeed}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-pawfeed}-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 3001
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run scripts/setup.sh or scripts/start.ps1 first}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawfeed}:${POSTGRES_PASSWORD:-pawfeed_dev}@postgres:5432/${POSTGRES_DB:-pawfeed}?schema=public
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://routing.openstreetmap.de}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-8000}
      ROUTING_RETRIES: ${ROUTING_RETRIES:-1}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_AUTH_REQUIRED: ${SMTP_AUTH_REQUIRED:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - pawfeed-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-pawfeed}-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:3001
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Local SMTP inbox: password reset works without personal Gmail credentials.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_BIND_HOST:-127.0.0.1}:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    restart: unless-stopped

volumes:
  postgres-data:
  pawfeed-uploads:
  mailpit-data:
