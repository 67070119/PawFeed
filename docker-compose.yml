services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawfeed}
      POSTGRES_USER: ${POSTGRES_USER:-pawfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawfeed_dev}
      TZ: Asia/Bangkok
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawfeed} -d ${POSTGRES_DB:-pawfeed}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 3001
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-before-production-123456}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawfeed}:${POSTGRES_PASSWORD:-pawfeed_dev}@postgres:5432/${POSTGRES_DB:-pawfeed}?schema=public
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://routing.openstreetmap.de}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-8000}
      ROUTING_RETRIES: ${ROUTING_RETRIES:-1}
    volumes:
      - pawfeed-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:3001
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  pawfeed-uploads:
